# Weekly: fetch the live facility list. If anything changed, open (or update) a pull request with the
# change report; merging it rebuilds and redeploys the site. If nothing changed, record today as the
# "last checked" date on main and redeploy, so the site shows the data was confirmed as current.
name: Check for data updates

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start the deploy workflow after recording the check date

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch & compare
        id: update
        run: |
          set +e
          python scripts/update.py --no-build --report "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "::error::Could not fetch the facility list (blocked or format changed). Run 'python scripts/update.py' locally, or use --html with a saved page."
            exit 1
          fi

      - name: Record the check date and redeploy
        # No changes: commit the new "checked" date in data/meta.json, then start the deploy.
        # (A push made with GITHUB_TOKEN doesn't trigger other workflows, so start it explicitly.)
        if: steps.update.outputs.code == '3' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/meta.json; then
            echo "Already marked as checked today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data checked $(date -u +%F): no changes" -- data/meta.json
          git push
          gh workflow run deploy.yml --ref main

      - name: Open pull request
        if: steps.update.outputs.code == '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data-update
          delete-branch: true
          commit-message: "Data update ${{ steps.update.outputs.date }}: ${{ steps.update.outputs.summary }}"
          title: "Data update ${{ steps.update.outputs.date }}: ${{ steps.update.outputs.summary }}"
          body-path: ${{ runner.temp }}/report.md
          labels: data-update
