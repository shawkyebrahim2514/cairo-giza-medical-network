# Builds the site, runs the browser tests, publishes to GitHub Pages and attaches
# the single offline HTML file to a GitHub Release named after the data snapshot.
name: Build & deploy

on:
  push:
    branches: [main]
    paths: [src/**, data/**, config/**, scripts/**, vendor/**, tests/**, .github/workflows/deploy.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.meta.outputs.snapshot }}
      checked: ${{ steps.meta.outputs.checked }}
      built: ${{ steps.meta.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build
        run: python scripts/build.py

      - name: Test (UI + PDF)
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python tests/ui_test.py
          python tests/pdf_test.py

      - id: meta
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          m = json.load(open("data/meta.json", encoding="utf-8-sig"))
          print(f"snapshot={m['snapshot']}")
          print(f"checked={max(m['snapshot'], m.get('checked', ''))}")
          import datetime
          print("built=" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC"))
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: dist/cairo-giza-medical-network.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: single-file
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: data-${{ needs.build.outputs.snapshot }}
          name: Data snapshot ${{ needs.build.outputs.snapshot }}
          body: |
            Offline single-file directory.

            | | |
            |---|---|
            | Data as of | **${{ needs.build.outputs.snapshot }}** (the last time the facility list changed) |
            | Last checked | **${{ needs.build.outputs.checked }}** (the last time it was confirmed as current) |
            | File built | ${{ needs.build.outputs.built }} from commit ${{ github.sha }} |

            Download **cairo-giza-medical-network.html** and open it in any browser – no internet or install needed.
            The file is rebuilt (and replaced here) whenever the site is redeployed, including after each weekly check.
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.
          files: cairo-giza-medical-network.html
          make_latest: true
